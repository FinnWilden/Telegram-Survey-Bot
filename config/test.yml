# =============================================================================
#  TEST-KONFIGURATION FÜR EINEN KURZEN TESTLAUF MIT ECHTEN TEILNEHMENDEN
# =============================================================================
#
#  Mit dieser Datei kannst du den Bot mit echten Personen ausprobieren, bevor
#  die eigentliche Studie startet. Ein kompletter Durchlauf dauert etwa
#  1 Stunde 15 Minuten. Alle Termine richten sich nach der Anmeldung der
#  jeweiligen Person, du musst also keine Studientage eintragen. Auch das
#  automatische Löschen der Links wird dabei getestet (siehe Abschnitt 3).
#
#  WICHTIG: Diese Datei ist die Vorlage im Git-Repository. Trage deinen Token
#  NICHT hier ein, sondern arbeite mit einer Kopie (siehe 1a).
#
# -----------------------------------------------------------------------------
#  1. DAS MUSST DU VOR DEM START ÄNDERN
# -----------------------------------------------------------------------------
#
#  a) Kopie anlegen und api_token eintragen (Pflicht)
#     Kopiere diese Datei nach config/local-test.yml und mache ALLE folgenden
#     Änderungen nur in der Kopie. Dateien mit dem Muster config/local-*.yml
#     ignoriert Git, so kann dein Token nicht versehentlich auf GitHub landen.
#       Windows (PowerShell):  Copy-Item config\test.yml config\local-test.yml
#       macOS / Linux:         cp config/test.yml config/local-test.yml
#
#     Trage in der Kopie den Token deines Bots ein. Du bekommst ihn in
#     Telegram vom @BotFather (Befehl /newbot für einen neuen Bot, /token für
#     einen bestehenden). Beispiel: api_token: "1234567890:AAH-abcdefg..."
#     Am besten verwendest du einen eigenen Test-Bot und nicht den Bot der
#     echten Studie. Speichern nicht vergessen.
#
#  b) subscription_start_date / subscription_deadline (prüfen)
#     Nur in diesem Zeitraum nimmt der Bot Anmeldungen an. Er ist auf
#     22.11.2026 bis 31.05.2027 eingestellt. Format: "JJJJ-MM-TT HH:MM".
#
#  c) urls (optional)
#     Ersetze die example.com-Links durch die Links deiner Umfragen (z. B.
#     SoSci Survey, LimeSurvey, Qualtrics). {participant} muss in jedem Link
#     stehen bleiben; der Bot setzt dort die Teilnehmernummer der Person ein,
#     z. B. https://example.com/start?id=04711. Lässt du example.com stehen,
#     öffnet der Link nur eine Beispielseite, aber die Nummer ist in der
#     Adresszeile sichtbar. Das reicht, um den Ablauf zu prüfen.
#
#  d) texts (optional)
#     Alle Nachrichten an die Teilnehmenden kannst du unten frei anpassen.
#
# -----------------------------------------------------------------------------
#  2. BOT STARTEN
# -----------------------------------------------------------------------------
#
#  Diese Datei braucht die Quellcode-Version vom main-Branch (oder ein Release
#  nach v2.0.0). v2.0.0 kennt die Teilnehmernummern noch nicht und startet
#  mit dieser Datei nicht.
#
#  Öffne eine Kommandozeile im Projektordner (dem Ordner mit bot.py) und
#  starte den Bot mit deiner Kopie als Argument:
#
#    Windows (PowerShell):   .\.venv\Scripts\Activate.ps1
#                            python bot.py config\local-test.yml
#
#    macOS / Linux:          source .venv/bin/activate
#                            python3 bot.py config/local-test.yml
#
#  Ohne Argument verwendet der Bot config/config.yml, NICHT deine Kopie.
#
#  Mit --debug am Ende (z. B. python bot.py config\local-test.yml --debug)
#  zeigt der Bot zusätzlich interne Details wie jeden geplanten Termin und
#  jede Job-Ausführung. Für normale Tests ist das nicht nötig.
#
#  Der Bot läuft, solange das Fenster offen ist und der Rechner nicht schläft.
#  Beenden mit Strg + C.
#
#  Optional, aber praktisch: Hinterlege beim @BotFather mit /setcommands die
#  Befehle, damit sie in Telegram als Menü erscheinen:
#    subscribe - Zur Studie anmelden
#    survey - Umfrage-Link anfordern
#    unsubscribe - Von der Studie abmelden
#    help - Hilfe anzeigen
#
# -----------------------------------------------------------------------------
#  3. DAS MACHEN DIE TEILNEHMENDEN
# -----------------------------------------------------------------------------
#
#  1. In Telegram nach dem Benutzernamen des Bots suchen und den Chat öffnen.
#  2. Auf "Starten" tippen (oder /start senden) -> Begrüßung.
#  3. /subscribe senden.
#  4. Der Bot fragt nach der Aufwachzeit. Für diesen Test die AKTUELLE
#     Uhrzeit eingeben, z. B. 14:05. Alle weiteren Nachrichten werden von
#     dieser Uhrzeit aus berechnet.
#
#  Danach passiert automatisch (Beispiel mit Eingabe 14:05):
#    sofort         Start-Link; die Frage nach der Aufwachzeit verschwindet
#    14:08          1. Tages-Link
#    14:10          2. Tages-Link, der 1. Tages-Link verschwindet
#    14:12          3. Tages-Link, der 2. Tages-Link verschwindet
#    14:15          End-Link
#    14:22          der 3. Tages-Link verschwindet (10 Minuten nach Versand)
#    14:25          der Start-Link verschwindet (20 Minuten nach Versand)
#    14:30          der End-Link verschwindet (15 Minuten nach Versand)
#    15:15          Erinnerung "Hast du die End-Umfrage schon ausgefüllt?"
#                   -> "Nein" schickt den End-Link erneut (verschwindet nach
#                   15 Minuten), "Ja" schließt ab.
#
#  Gelöscht wird bis zu 30 Sekunden nach der angegebenen Zeit. Ein Link per
#  /survey verschwindet nach 10 Minuten oder beim nächsten Tages-Link, die
#  Antwort "Du bist bereits angemeldet" nach einer Minute.
#
#  Der Start-Link und der 3. Tages-Link sind also noch zu sehen, wenn schon
#  der nächste Link da ist. Darauf weist der Bot beim Start mit einer Warnung
#  "Survey links overlap" hin. Soll immer nur der neueste Link zu sehen sein,
#  setze unten deleteOldLinksBeforeNewLink: true. Dann verschwindet jeder Link
#  direkt vor dem nächsten: der Start-Link um 14:08, der 3. Tages-Link um 14:15
#  (der End-Link wie oben um 14:30).
#
#  Optional, Löschen nach einem Neustart testen: Beende den Bot nach dem
#  End-Link (z. B. um 14:16) mit Strg + C und starte ihn nach 14:31
#  wieder. Auf die Frage nach offenen Terminen mit y antworten (die
#  Erinnerung steht noch aus). Direkt nach dem Start verschwinden der
#  3. Tages-Link, der Start-Link und der End-Link, weil sie in der Pause
#  fällig wurden.
#
#  Hinweis: Telegram erlaubt Bots das Löschen nur bis 48 Stunden nach dem
#  Versand. Ältere Links bleiben stehen; der Bot meldet das im Log.
#
#  Jederzeit möglich:
#    /survey       schickt sofort einen Tages-Link
#    /unsubscribe  meldet ab, danach kommen keine Nachrichten mehr
#    /help         zeigt die Befehle
#
#  Wichtig: Wer eine Uhrzeit eingibt, die schon mehr als ein paar Minuten
#  vorbei ist, bekommt die Tages- und End-Links nicht, weil deren Termine dann
#  in der Vergangenheit liegen. In dem Fall: /unsubscribe, dann erneut
#  /subscribe und die aktuelle Uhrzeit eingeben.
#
#  Alle Teilnehmenden und der Rechner mit dem Bot sollten in derselben
#  Zeitzone sein.
#
# -----------------------------------------------------------------------------
#  4. WÄHREND DES TESTS
# -----------------------------------------------------------------------------
#
#  Im Kommandozeilenfenster siehst du eine Live-Übersicht. Umschalten mit
#  einer Taste (ohne Enter):
#    d  Dashboard: Anzahl Teilnehmende, Anmeldungen, gesendete Nachrichten
#    p  Teilnehmende: Telegram-ID, Teilnehmernummer, Status, Aufwachzeit, ...
#    v  Versandverlauf: die letzten 100 gesendeten Nachrichten
#    n / b  nächste / vorherige Seite
#    u  neue Umfrage: Testlauf abschließen und von vorne beginnen (siehe 5.)
#    Strg + C  Bot beenden
#
#  Dieselben Infos stehen auch als Dateien im Ordner export (jede Minute
#  aktualisiert): overview.txt, participants.csv und deliveries.csv. Die CSV-
#  Dateien lassen sich per Doppelklick in Excel öffnen.
#
#  Startest du den Bot neu, während noch Termine offen sind, fragt er in der
#  Kommandozeile, ob er sie neu einplanen soll:
#    y -> offene Termine werden weiter verschickt (normalerweise richtig)
#    n -> er fragt danach, ob die Einträge aus der Datenbank gelöscht werden
#
# -----------------------------------------------------------------------------
#  5. NACH DEM TEST
# -----------------------------------------------------------------------------
#
#  Die Testpersonen, ihre Teilnehmernummern und alle Versanddaten liegen in
#  db/userIdDb.db. Bevor die echte Studie startet (oder für einen weiteren
#  Testlauf), drücke im laufenden Bot die Taste u und bestätige mit j:
#    - die Datenbank wird als db/userIdDb_abgeschlossen_<Datum>_<Uhrzeit>.db
#      gesichert, die Übersichtsdateien in export/abgeschlossen_<Datum>_<Uhrzeit>/
#    - der Bot läuft mit leerer Datenbank weiter; alle können sich neu
#      anmelden und bekommen neue Teilnehmernummern.
#  Ohne diesen Schritt zählen die Testpersonen in der Studie mit und behalten
#  ihre Nummern. Für die echte Studie danach den Bot mit Strg + C beenden und
#  mit der echten Config (z. B. config/config.yml) starten; u funktioniert
#  auch dort direkt nach dem Start.
#  Protokolle des Testlaufs liegen im Ordner log.
#
# =============================================================================

api_token: "YOUR_TELEGRAM_BOT_TOKEN"

surveyCommandEnabled: true          # /survey liefert jederzeit einen Tages-Link
participantsEnterCondition: false   # Kondition wird vom Bot vergeben, nicht abgefragt
uniqueConditions: false             # beliebig viele Personen pro Kondition

subscription_start_date: "2026-11-22 00:00"
subscription_deadline: "2027-05-31 23:59"

# Feste Studientage werden nicht gebraucht, weil useDayCalculation aktiv ist.
daily_dates: []
daily_times: []
end_dates: []
end_times: []

useTimeZoneCalculation: false

# Tag 0 = Tag der Anmeldung: alle Umfragen kommen noch am selben Tag.
useDayCalculation: true
dayCalculationSettings:
  daily_SurveyDays: [0]
  end_SurveyDays: [0]

# Uhrzeiten ab der eingegebenen Aufwachzeit (hier: aktuelle Uhrzeit).
useTimeCalculation: true
timeCalculationSettings:
  daily_DelayMinutesAfterWakeup: 3     # 1. Tages-Link 3 Minuten nach der Eingabe
  daily_SurveysPerDay: 3               # 3 Tages-Links ...
  daily_DelayMinutesBetweenSurveys: 2  # ... im Abstand von 2 Minuten

  end_DelayMinutesAfterWakeup: 10      # End-Link 10 Minuten nach der Eingabe
  end_SurveysPerDay: 1
  end_DelayMinutesBetweenSurveys: 1

# Kurze Löschzeiten, damit jede Lösch-Einstellung im Testlauf sichtbar wird
# (Zeitplan siehe Abschnitt 3 oben). Für die echte Studie längere Zeiten wählen.
linkDeletionSettings:
  deleteSubscriptionSetupMessages: true       # Frage nach der Aufwachzeit nach der Antwort löschen

  start_DeleteLinkAtSubscriptionDeadline: false   # Anmeldeschluss liegt für einen Test zu weit weg
  start_DeleteLinkTimer: true
  start_DeleteDelayMinutes: 20                # Start-Link 20 Minuten nach Versand löschen

  daily_DeleteLinkAtNewLink: true             # neuer Tages-Link löscht den vorherigen
  daily_DeleteLinkTimer: true
  daily_DeleteDelayMinutes: 10                # Tages-Link spätestens 10 Minuten nach Versand löschen

  end_DeleteLinkAtNewLink: false
  end_DeleteLinkTimer: true
  end_DeleteDelayMinutes: 15                  # End-Link 15 Minuten nach Versand löschen

  deleteOldLinksBeforeNewLink: false          # true: vor jedem neuen Link alle alten löschen

# Keine zufällige Verschiebung, damit die Zeiten oben genau stimmen.
randomTimeShiftSettings:
  daily_RandomTimeShiftMinutes: 0
  end_RandomTimeShiftMinutes: 0

endSurveyReminderEnabled: true
endSurveyReminderDelayHours: 1         # Erinnerung 1 Stunde nach dem End-Link

# Jede Person bekommt eine zufällige, feste 5-stellige Nummer (z. B. 04711),
# die in allen ihren Links an der Stelle von {participant} steht.
useParticipantNumbers: true
participantNumberDigits: 5

urls:
  start_url:
    - "https://example.com/start?id={participant}"

  daily_url:
    - "https://example.com/daily?id={participant}"

  end_url:
    - "https://example.com/end?id={participant}"

  end_url_distribution: "NONE"

texts:
  welcome: "Willkommen beim Test des Umfrage-Bots! Sende /subscribe, um teilzunehmen."

  subscribe: "Danke, du bist angemeldet! Bitte fülle zuerst die Start-Umfrage aus. In den nächsten Minuten bekommst du weitere Umfrage-Links."
  subscribe_early: "Die Anmeldung ist noch nicht geöffnet."
  subscribe_late: "Die Anmeldung ist bereits geschlossen."
  subscribe_already: "Du bist bereits angemeldet."
  subscribe_max_participants: "Leider sind keine Plätze mehr frei."

  subscribe_wakeup_time: "Bitte gib für diesen Test die AKTUELLE Uhrzeit ein, so als wärst du gerade aufgewacht. Format"
  subscribe_condition: "Bitte gib deine Bedingungsnummer ein"
  subscribe_timezone: "Bitte gib dein aktuelles Datum und deine aktuelle Uhrzeit ein. Format"

  unsubscribe: "Du bist abgemeldet und bekommst keine Umfragen mehr."

  daily_reminder: "Zeit für eine kurze Tages-Umfrage!"
  end_reminder: "Zeit für die End-Umfrage!"

  survey_reply: "Hier ist dein Link zur Tages-Umfrage."
  survey_not_subscribed: "Du bist noch nicht angemeldet. Bitte sende zuerst /subscribe."

  endSurveyReminder: "Hast du die End-Umfrage schon ausgefüllt?"
  endSurveyReminderYes: "Ja"
  endSurveyReminderNo: "Nein"

help:
  helpEnabled: true
  help_text: "Verfügbare Befehle:\n/subscribe - zur Studie anmelden\n/unsubscribe - von der Studie abmelden"
  surveyCommandHelp: "\n/survey - Link zur Tages-Umfrage anfordern"
