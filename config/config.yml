api_token: "YOUR_TELEGRAM_BOT_TOKEN"

surveyCommandEnabled: true
participantsEnterCondition: false
uniqueConditions: false

subscription_start_date: "2026-05-15 08:00"
subscription_deadline: "2026-05-20 20:00"

daily_dates: ["2020-08-23", "2020-08-24", "2020-08-25"]
daily_times: [
              ["12:18", "12:20", "10:52", "10:42", "16:45"],
              ["10:00", "12:00"],
              ["10:00"]
            ]
end_dates: ["2020-08-26", "2020-08-27"]
end_times: [
            ["08:00", "18:45"],
            ["10:00", "11:20"]
          ]

useTimeZoneCalculation: false

useDayCalculation: false
dayCalculationSettings:
  daily_SurveyDays: [1, 2, 5]
  end_SurveyDays: [7, 9]

useTimeCalculation: false
timeCalculationSettings:
  daily_DelayMinutesAfterWakeup: 30
  daily_SurveysPerDay: 3
  daily_DelayMinutesBetweenSurveys: 120

  end_DelayMinutesAfterWakeup: 45
  end_SurveysPerDay: 2
  end_DelayMinutesBetweenSurveys: 90

# Planned deletions are stored and also happen after a restart. Telegram only lets bots
# delete messages within 48 hours, so delays of 2880 minutes or more have no effect.
linkDeletionSettings:
  deleteSubscriptionSetupMessages: false

  start_DeleteLinkAtSubscriptionDeadline: false
  start_DeleteLinkTimer: false
  start_DeleteDelayMinutes: 240

  daily_DeleteLinkAtNewLink: false
  daily_DeleteLinkTimer: true
  daily_DeleteDelayMinutes: 60

  end_DeleteLinkAtNewLink: true
  end_DeleteLinkTimer: false
  end_DeleteDelayMinutes: 120

randomTimeShiftSettings:
  daily_RandomTimeShiftMinutes: 5
  end_RandomTimeShiftMinutes: 0

endSurveyReminderEnabled: true
endSurveyReminderDelayHours: 1

# Participant numbers: every participant gets a random number that no other
# participant has, e.g. 04711. It is stored permanently and inserted into all
# of that participant's links (start, daily and end), also after re-subscribing.
# There is no limit on the number of participants: when all numbers with
# 'participantNumberDigits' digits are taken, the next ones get one digit more.
# Set 'useParticipantNumbers' to false to send the urls exactly as written.
useParticipantNumbers: true
participantNumberDigits: 5      # length of the number incl. leading zeros: 5 -> 04711

# Every url must contain {participant} while 'useParticipantNumbers' is true.
# It can stand anywhere in the url, in the middle or at the end:
#   "https://survey.example/start?id={participant}&lang=de"
#   "https://survey.example/start/{participant}"
# One url per survey is enough. Add more urls (same count in all three lists)
# only to run several conditions; participants are then split between them.
urls:
  start_url:
    - "https://example.com/start?id={participant}"

  daily_url:
    - "https://example.com/daily?id={participant}"

  end_url:
    - "https://example.com/end?id={participant}"

  # NONE: one end url. DAY, TIME, MIXED or RANDOM use a different end url per
  # end day/time; then write that condition's end urls as a list:
  #   - ["https://example.com/end-day1?id={participant}", "https://example.com/end-day2?id={participant}"]
  end_url_distribution: "NONE"

texts:
  welcome: "Welcome to the survey bot."

  subscribe: "You will get now reminders for the actual survey. Please fill out the start survey."
  subscribe_early: "Sorry, the survey has not started yet."
  subscribe_late: "Sorry, the survey has already started."
  subscribe_already: "Sorry, you are already subscribed."
  subscribe_max_participants: "Sorry, the maximum number of participants has been reached."

  subscribe_wakeup_time: "Please tell me your wakeup time in the format"
  subscribe_condition: "Please enter your condition number"
  subscribe_timezone: "Please tell me your current date and time in the format"

  unsubscribe: "You will get no longer reminder for actual surveys."

  daily_reminder: "Hi there, it is time for a daily survey."
  end_reminder: "Hi, it is time for the end survey."

  survey_reply: "Here is your survey link."
  survey_not_subscribed: "You are not subscribed yet. Please send /subscribe first."

  endSurveyReminder: "Hi, have you already participated the end survey?"
  endSurveyReminderYes: "Yes"
  endSurveyReminderNo: "No"

help:
  helpEnabled: true
  help_text: "Here are all available commands:\n/subscribe - activates the reminder service\n/unsubscribe - deactivates the reminder service"
  surveyCommandHelp: "\n/survey - send you an daily survey link"